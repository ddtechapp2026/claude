<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stonks Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;
      --green:#3fb950;--red:#f85149;--accent:#58a6ff;--amber:#d29922;}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);padding:16px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
    h1{font-size:20px;margin:0}h1 span{color:var(--accent)}
    .muted{color:var(--muted);font-size:13px}
    .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px}
    .tab{flex:0 0 auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;
      padding:10px 12px;cursor:pointer;min-width:130px;transition:border-color .15s}
    .tab:hover{border-color:var(--accent)}
    .tab.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
    .tab .name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
    .tab .sub{font-size:12px;margin-top:4px}
    .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
    .dot.on{background:var(--green)}.dot.off{background:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}
    .card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
    .card .value{font-size:22px;font-weight:600;margin-top:6px}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
    .panel h2{font-size:14px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .pos{color:var(--green)}.neg{color:var(--red)}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
    th{color:var(--muted);font-weight:600}.right{text-align:right}
    .overflow{overflow-x:auto}
    .tag{font-family:ui-monospace,monospace;font-size:12px;padding:1px 6px;border-radius:4px;background:#30363d}
    .tag.BUY{background:#3fb95033;color:var(--green)}.tag.SELL{background:#f8514933;color:var(--red)}
    .tag.HOLD{background:#30363d;color:var(--muted)}
    button{font:inherit;border:1px solid var(--border);background:#21262d;color:var(--text);
      padding:8px 14px;border-radius:8px;cursor:pointer}
    button:hover{border-color:var(--accent)}
    button.primary{background:var(--accent);color:#04101f;border-color:var(--accent);font-weight:600}
    button.on{background:var(--green);color:#04140a;border-color:var(--green);font-weight:600}
    button.off{background:#21262d}
    button.danger:hover{border-color:var(--red);color:var(--red)}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
    input,select,textarea{width:100%;background:#0d1117;color:var(--text);border:1px solid var(--border);
      border-radius:8px;padding:8px;font:inherit}
    textarea{min-height:70px;resize:vertical}
    .formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
    .banner{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
    .banner.ok{background:#3fb95022;border:1px solid var(--green)}
    .banner.warn{background:#d2992222;border:1px solid var(--amber)}
    .pill{font-size:11px;padding:2px 8px;border-radius:999px;background:#30363d;color:var(--muted)}
    .pill.ai{background:#1f6feb33;color:var(--accent)}
    /* AI Control slide switch */
    .switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
    .switch input{position:absolute;opacity:0;width:0;height:0}
    .switch .track{width:46px;height:26px;background:#30363d;border-radius:999px;position:relative;transition:background .15s;flex:0 0 auto}
    .switch .track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
    .switch input:checked + .track{background:var(--accent)}
    .switch input:checked + .track::after{transform:translateX(20px)}
    .aibox{border:1px solid var(--border);border-radius:10px;padding:12px;background:#0d1117;margin-top:12px}
  </style>
</head>
<body>
  <header>
    <h1><span>Stonks</span> &middot; multi-bot control center</h1>
    <div class="muted">AI: <span id="ai-state">-</span>
      <button onclick="testAi()" style="padding:2px 8px;font-size:12px;margin-left:6px">Test AI</button>
      &middot; updated <span id="updated">-</span></div>
  </header>
  <div id="ai-test"></div>

  <div class="tabs" id="tabs"></div>
  <div id="detail"></div>

<script>
const fmtUsd=n=>(n==null)?"-":"$"+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtTime=iso=>{try{return new Date(iso).toISOString().replace("T"," ").slice(0,16)}catch{return iso||"-"}};
const el=id=>document.getElementById(id);
const pct=n=>(n==null)?"-":(Number(n)*100).toFixed(1)+"%";
let currentBotId=null, chart=null, bots=[], universe=[], freeModels=[], defaultModel="";

function symbolOptions(sel){
  const opts = ['AUTO', ...universe];
  if(sel && !opts.includes(sel)) opts.push(sel);   // keep a custom value visible
  return opts.map(s=>`<option value="${s}" ${s===sel?'selected':''}>${s==='AUTO'?'Auto — pick any crypto':s}</option>`).join("");
}

function modelOptions(sel){
  let list=[...freeModels];
  if(sel && !list.includes(sel)) list.unshift(sel);   // keep current pick visible even if delisted
  let html=`<option value="" ${sel===""?'selected':''}>Default (${defaultModel||'global'})</option>`;
  html+=list.map(m=>`<option value="${m}" ${m===sel?'selected':''}>${m}</option>`).join("");
  return html;
}

async function loadModels(force){
  try{const r=await api("/api/models"+(force?"?refresh=1":"")); freeModels=r.free||[];}catch(e){/* keep old */}
}
async function testBotModel(){
  const m=el("f-model").value, box=el("model-test");
  box.textContent="testing…";
  try{const r=await api("/api/ai/test"+(m?("?model="+encodeURIComponent(m)):""));
    box.innerHTML = r.ok ? `<span class="pos">✓ ${r.model} works</span>` : `<span class="neg">✗ ${r.stage||''} ${r.status||''}: ${(r.detail||'').slice(0,140)}</span>`;
  }catch(e){box.innerHTML=`<span class="neg">✗ ${e.message}</span>`;}
}

async function api(url,opts){const r=await fetch(url,{cache:"no-store",...opts});
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||r.statusText);return r.json();}

function renderTabs(){
  el("tabs").innerHTML = bots.map(b=>{
    const cls = b.id===currentBotId?"tab active":"tab";
    const pnlCls = b.pnl>=0?"pos":"neg";
    return `<div class="${cls}" onclick="selectBot(${b.id})">
      <div class="name"><span class="dot ${b.enabled?'on':'off'}"></span>${b.name}</div>
      <div class="sub"><span class="muted">${b.symbol}</span> · <span class="${pnlCls}">${fmtUsd(b.equity)} (${b.pnl>=0?'+':''}${b.pnl_pct.toFixed(1)}%)</span></div>
    </div>`;}).join("");
}

function detailHTML(d){
  const b=d.bot, w=b.wallet||{}, c=b.costs||{};
  const held = (w.position_qty||0)>0;
  const runUntilVal = b.run_until ? b.run_until.slice(0,16) : "";
  return `
  <div class="grid">
    <div class="card"><div class="label">Equity</div><div class="value">${fmtUsd(b.equity)}</div></div>
    <div class="card"><div class="label">Total P/L</div><div class="value ${b.pnl>=0?'pos':'neg'}">${fmtUsd(b.pnl)} (${b.pnl>=0?'+':''}${b.pnl_pct.toFixed(1)}%)</div></div>
    <div class="card"><div class="label">Cash</div><div class="value">${fmtUsd(w.cash)}</div></div>
    <div class="card"><div class="label">Position</div><div class="value">${held?Number(w.position_qty).toFixed(6)+' <span class="tag">'+(w.position_symbol||'')+'</span>':'flat'}</div></div>
    <div class="card"><div class="label">Realized P/L</div><div class="value ${(w.realized_pnl||0)>=0?'pos':'neg'}">${fmtUsd(w.realized_pnl)}</div></div>
    <div class="card"><div class="label">State</div><div class="value" style="font-size:15px">${b.enabled?'<span class="pos">running</span>':'<span class="muted">off</span>'} · <span class="muted">${b.status||''}</span></div></div>
  </div>

  <div class="panel">
    <div class="row" style="justify-content:space-between">
      <div><b>${b.name}</b> <span class="pill">${b.symbol}</span> <span class="pill ${b.ai_control?'ai':''}">AI Control ${b.ai_control?'ON':'OFF'}</span> <span class="pill">🧠 ${b.model||'default'}</span></div>
      <div class="row">
        <button class="${b.enabled?'on':'off'}" onclick="toggleBot(${b.id})">${b.enabled?'⏸ Turn OFF':'▶ Turn ON'}</button>
        <a href="/api/bots/${b.id}/export" download style="text-decoration:none"><button>⬇ Export data</button></a>
        <button class="danger" onclick="resetBot(${b.id})">Reset wallet</button>
      </div>
    </div>
    <div class="muted" style="margin-top:8px">Trades: ${b.strategy_summary}</div>
    <div class="aibox">
      <label class="switch"><input type="checkbox" ${b.ai_control?'checked':''} onchange="setAiControl(${b.id}, this.checked)">
        <span class="track"></span><b>AI Control</b></label>
      <div class="muted" style="margin-top:8px;font-size:13px">
        ${b.ai_control
          ? '<b style="color:var(--accent)">ON:</b> the bot follows its own strategy and actively manages the trade — trailing the stop and moving it to break-even, and tuning position size as it learns. Your stop-loss and take-profit are <b>hard guardrails it can only tighten within, never exceed</b>.'
          : '<b>OFF:</b> your controls are the answer. Fixed stop-loss and take-profit exactly as set, strategy entry/exit as written. <b>No dynamic adjustments and no learning.</b>'}
      </div>
    </div>
  </div>

  <div class="panel"><h2>Equity curve</h2><canvas id="equityChart" style="max-height:260px"></canvas></div>

  <div class="panel">
    <h2>P&amp;L breakdown <span class="muted" style="text-transform:none">(fees &amp; taxes accounted for)</span></h2>
    <table style="max-width:520px">
      <tbody>
        <tr><td>Gross trading P/L <span class="muted">(realized, before costs)</span></td>
            <td class="right ${c.gross_realized>=0?'pos':'neg'}">${fmtUsd(c.gross_realized)}</td></tr>
        <tr><td>− Fees paid <span class="muted">(${(b.fee_pct*100).toFixed(2)}%/side)</span></td>
            <td class="right neg">−${fmtUsd(c.fees)}</td></tr>
        <tr><td><b>= Net after fees</b></td>
            <td class="right ${c.net_after_fees>=0?'pos':'neg'}"><b>${fmtUsd(c.net_after_fees)}</b></td></tr>
        <tr><td>− Estimated taxes <span class="muted">(${(c.tax_pct*100).toFixed(0)}% of net gains)</span></td>
            <td class="right neg">−${fmtUsd(c.est_tax)}</td></tr>
        <tr><td><b>= Net realized P/L</b></td>
            <td class="right ${c.net_realized>=0?'pos':'neg'}"><b>${fmtUsd(c.net_realized)}</b></td></tr>
        <tr><td>Unrealized P/L <span class="muted">(open position, pre-tax)</span></td>
            <td class="right ${c.unrealized>=0?'pos':'neg'}">${fmtUsd(c.unrealized)}</td></tr>
        <tr style="border-top:2px solid var(--border)"><td><b>Total P/L (all-in)</b></td>
            <td class="right ${c.total_pnl>=0?'pos':'neg'}"><b>${fmtUsd(c.total_pnl)}</b></td></tr>
      </tbody>
    </table>
    <div class="muted" style="margin-top:8px;font-size:12px">Taxes are a rough estimate (flat rate on net realized gains); real crypto taxes depend on holding period and your bracket.</div>
  </div>

  <div class="panel">
    <h2>How this bot trades (plain English)</h2>
    <div id="strat-banner"></div>
    <textarea id="strat-text" placeholder="e.g. Buy when RSI drops below 30, sell when it goes above 70. Use 40% of cash.">${b.strategy_text||""}</textarea>
    <div class="row" style="margin-top:10px">
      <button class="primary" onclick="saveStrategy(${b.id})">Translate &amp; save strategy</button>
      <span class="muted">The AI turns your words into trading rules${d.bot ? '' : ''}.</span>
    </div>
  </div>

  <div class="panel">
    <h2>Controls</h2>
    <div class="formgrid">
      <div><label>Name</label><input id="f-name" value="${b.name}"></div>
      <div><label>Crypto (or Auto = pick any)</label><select id="f-symbol">${symbolOptions(b.symbol)}</select></div>
      <div><label>AI model (free list, auto-updates)</label>
        <select id="f-model">${modelOptions(b.model||"")}</select>
        <div style="margin-top:6px"><button type="button" onclick="testBotModel()" style="padding:4px 10px;font-size:12px">Test this model</button> <span id="model-test" class="muted" style="font-size:12px"></span></div>
      </div>
      <div><label>Starting cash (USD)</label><input id="f-cash" type="number" value="${b.starting_cash}"></div>
      <div><label>Biggest trade (USD)</label><input id="f-max" type="number" value="${b.max_trade_usd}"></div>
      <div><label>Stop loss (%)</label><input id="f-stop" type="number" step="0.1" value="${(b.stop_loss_pct*100).toFixed(1)}"></div>
      <div><label>Take profit (%)</label><input id="f-tp" type="number" step="0.1" value="${(b.take_profit_pct*100).toFixed(1)}"></div>
      <div><label>Trading fee per side (%)</label><input id="f-fee" type="number" step="0.01" value="${(b.fee_pct*100).toFixed(2)}"></div>
      <div><label>Estimated tax (%)</label><input id="f-tax" type="number" step="1" value="${(b.tax_pct*100).toFixed(0)}"></div>
      <div><label>Run until (blank = forever)</label><input id="f-until" type="datetime-local" value="${runUntilVal}"></div>
    </div>
    <div class="muted" style="margin-bottom:10px;font-size:12px">Stop-loss & take-profit are your guardrails. With AI Control ON (above) the bot manages within them; with it OFF they're fixed.</div>
    <button class="primary" onclick="saveConfig(${b.id})">Save controls</button>
    <span id="cfg-msg" class="muted"></span>
  </div>

  <div class="panel overflow"><h2>Recent trades</h2>
    <table><thead><tr><th>Time</th><th>Symbol</th><th>Side</th><th class="right">Qty</th><th class="right">Price</th><th class="right">Notional</th><th class="right">Fee</th><th class="right">Net P/L</th><th>Reason</th></tr></thead>
    <tbody>${(d.trades||[]).map(t=>`<tr><td>${fmtTime(t.ts)}</td><td><span class="tag">${t.symbol||'-'}</span></td><td><span class="tag ${t.side}">${t.side}</span></td>
      <td class="right">${t.qty?Number(t.qty).toFixed(6):'-'}</td><td class="right">${fmtUsd(t.price)}</td>
      <td class="right">${t.notional?fmtUsd(t.notional):'-'}</td>
      <td class="right muted">${t.fee!=null?fmtUsd(t.fee):'-'}</td>
      <td class="right ${((t.pnl||0)>=0)?'pos':'neg'}">${t.pnl!=null?fmtUsd(t.pnl):'-'}</td>
      <td class="muted">${t.reason||''}</td></tr>`).join("")||`<tr><td colspan="9" class="muted">No trades yet.</td></tr>`}</tbody></table>
  </div>

  <div class="panel overflow"><h2>AI learning log</h2>
    <table><thead><tr><th>Time</th><th>Source</th><th>Summary</th><th>Applied changes</th></tr></thead>
    <tbody>${(d.reviews||[]).map(r=>`<tr><td>${fmtTime(r.ts)}</td><td><span class="pill ${r.source==='ai'?'ai':''}">${r.source}</span></td>
      <td>${r.summary||''}</td><td class="muted">${r.changes||''}</td></tr>`).join("")||`<tr><td colspan="4" class="muted">No reviews yet — they run after several closed trades.</td></tr>`}</tbody></table>
  </div>

  <div class="panel overflow"><h2>Decision journal <span class="muted" style="text-transform:none">(every move + reasoning; hover a row for indicators)</span></h2>
    <table><thead><tr><th>Time</th><th>Symbol</th><th>Signal</th><th class="right">Price</th><th>Reasoning</th></tr></thead>
    <tbody>${(d.signals||[]).map(s=>`<tr title="${s.context?String(s.context).replace(/"/g,'&quot;'):''}"><td>${fmtTime(s.ts)}</td>
      <td><span class="tag">${s.symbol||'-'}</span></td><td><span class="tag ${s.signal}">${s.signal}</span></td>
      <td class="right">${fmtUsd(s.price)}</td><td class="muted">${s.detail||''}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">No decisions yet.</td></tr>`}</tbody></table>
  </div>`;
}

function renderChart(curve){
  const ctx=el("equityChart"); if(!ctx)return;
  const labels=curve.map(p=>fmtTime(p.ts).slice(5)); const data=curve.map(p=>p.equity);
  if(chart){chart.destroy();}
  chart=new Chart(ctx,{type:"line",data:{labels,datasets:[{data,borderColor:"#58a6ff",
    backgroundColor:"rgba(88,166,255,0.12)",fill:true,tension:.25,pointRadius:0,borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
    scales:{x:{ticks:{color:"#8b949e",maxTicksLimit:8},grid:{color:"#21262d"}},
            y:{ticks:{color:"#8b949e"},grid:{color:"#21262d"}}}}});
}

async function selectBot(id){currentBotId=id; renderTabs(); await loadDetail();}

async function loadDetail(){
  if(currentBotId==null)return;
  try{const d=await api(`/api/bots/${currentBotId}`);
    el("detail").innerHTML=detailHTML(d); renderChart(d.equity_curve||[]);
  }catch(e){el("detail").innerHTML=`<div class="banner warn">Could not load bot: ${e.message}</div>`;}
}

async function loadBots(){
  const d=await api("/api/bots"); bots=d.bots; universe=d.universe||[]; defaultModel=d.model||"";
  el("ai-state").textContent = d.ai_enabled
    ? `on · ${d.model}${d.free_only ? " · free-only" : ""}`
    : "off — using rule-based parser";
  if(currentBotId==null && bots.length) currentBotId=bots[0].id;
  renderTabs();
}

async function toggleBot(id){await api(`/api/bots/${id}/toggle`,{method:"POST"}); await loadBots(); await loadDetail();}
async function testAi(){
  const box=el("ai-test");
  box.innerHTML=`<div class="banner">Testing AI (one real OpenRouter call)…</div>`;
  try{const r=await api("/api/ai/test");
    if(r.ok){box.innerHTML=`<div class="banner ok"><b>AI works ✓</b> model <span class="tag">${r.model}</span> — ${r.detail}</div>`;}
    else{box.innerHTML=`<div class="banner warn"><b>AI not working</b> (${r.stage}${r.status?' '+r.status:''}) · model <span class="tag">${r.model||'-'}</span><br>${r.detail}</div>`;}
  }catch(e){box.innerHTML=`<div class="banner warn">Test failed: ${e.message}</div>`;}
}
async function setAiControl(id, on){
  await api(`/api/bots/${id}/config`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ai_control:on})});
  await loadBots(); await loadDetail();
}
async function resetBot(id){if(!confirm("Reset this bot's wallet and clear its history?"))return;
  await api(`/api/bots/${id}/reset`,{method:"POST"}); await loadBots(); await loadDetail();}

async function saveStrategy(id){
  const text=el("strat-text").value.trim(); if(!text)return;
  el("strat-banner").innerHTML=`<div class="banner">Translating…</div>`;
  try{const r=await api(`/api/bots/${id}/strategy`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
    el("strat-banner").innerHTML=`<div class="banner ok"><b>Saved (${r.source}).</b> ${r.summary}</div>`;
    await loadBots();
  }catch(e){el("strat-banner").innerHTML=`<div class="banner warn">Failed: ${e.message}</div>`;}
}

async function saveConfig(id){
  const until=el("f-until").value;
  const body={name:el("f-name").value,symbol:el("f-symbol").value,
    starting_cash:parseFloat(el("f-cash").value),max_trade_usd:parseFloat(el("f-max").value),
    stop_loss_pct:parseFloat(el("f-stop").value),take_profit_pct:parseFloat(el("f-tp").value),
    fee_pct:parseFloat(el("f-fee").value),tax_pct:parseFloat(el("f-tax").value),
    model:el("f-model").value,
    run_until:until?new Date(until).toISOString():""};
  el("cfg-msg").textContent="Saving…";
  try{await api(`/api/bots/${id}/config`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    el("cfg-msg").textContent="Saved ✓"; await loadBots(); await loadDetail();
  }catch(e){el("cfg-msg").textContent="Failed: "+e.message;}
}

async function tick(){try{await loadBots();
  // only auto-refresh detail if the user isn't typing in a field
  if(document.activeElement && ["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) return;
  await loadDetail(); el("updated").textContent=new Date().toLocaleTimeString();
}catch(e){el("detail").innerHTML=`<div class="banner warn">Dashboard error: ${e.message}</div>`;}}

(async()=>{await loadModels(); await loadBots(); await loadDetail();
  el("updated").textContent=new Date().toLocaleTimeString();
  setInterval(tick,10000);
  setInterval(loadModels, 600000);  // refresh the free-model list every 10 min
})();
</script>
</body>
</html>
