# nginx reverse proxy for the Stonks dashboard.
#
# This is what makes the dashboard reachable from another network, protected by
# a username/password (HTTP Basic Auth). The dashboard itself only listens on
# localhost; nginx is the only thing exposed.
#
# Install:
#   sudo cp deploy/nginx-stonks.conf /etc/nginx/sites-available/stonks
#   sudo ln -sf /etc/nginx/sites-available/stonks /etc/nginx/sites-enabled/stonks
#   sudo rm -f /etc/nginx/sites-enabled/default   # optional: drop the welcome page
#   sudo nginx -t && sudo systemctl reload nginx
#
# Create the login (you will be prompted for a password):
#   sudo apt-get install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.stonks_htpasswd youradminname
#
# NOTE: This serves plain HTTP. Your password is base64-encoded, not encrypted,
# so anyone on the path can read it. For real use put HTTPS in front of it:
# either point a domain at the VM and run `sudo certbot --nginx`, or use the
# Cloudflare Tunnel option described in docs/ORACLE_SETUP.md.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;   # replace with your domain or public IP if you have one

    # Reasonable upload/response limits for a dashboard.
    client_max_body_size 2m;

    location / {
        auth_basic "Stonks - restricted";
        auth_basic_user_file /etc/nginx/.stonks_htpasswd;

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check without auth, handy for uptime monitors.
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
    }
}
